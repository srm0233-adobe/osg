version: 1

indices:
  # Editorial articles feed. Powers the feed-driven "Latest Articles"
  # cards-articles block (blocks/cards-articles). Exposes the per-article
  # metadata (author, category, date) added to each page so the cards can show
  # the category pill and author byline, and be ordered newest-first by date.
  editorial:
    include:
      - '/magazines/**/editorial/**'
    exclude:
      - '/**/*test*'
    target: /magazines/petersen-hunting/editorial/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      author:
        select: head > meta[name="author"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      # `date` is a reserved index column with built-in handling that ignores a
      # custom meta select, so expose the article date under our own property.
      publishDate:
        select: head > meta[name="date"]
        value: attribute(el, 'content')
